# __LAB_TITLE__ — the environment.
#
# A container is a host; a network is a segment. This starter has an attacker box
# and one target on a single network. Grow it: add hosts, add a second network for
# segmentation, give services static IPs the guide can reference.
services:
  attacker:
    # The workstation the student lands in — built from base.Dockerfile so it has
    # the welcome banner, `labhelp`/`netmap`, and a themed prompt out of the box.
    # `pull` (from GHCR, once CI has published it) is tried first; a fresh lab has
    # nothing to pull, so it builds locally the first time. Add tools in base.Dockerfile.
    build:
      context: .
      dockerfile: base.Dockerfile
    image: ghcr.io/__OWNER__/__LAB_SLUG__-base:latest
    container_name: __LAB_SLUG__-attacker
    hostname: attacker
    stdin_open: true
    tty: true
    cap_add:
      - NET_ADMIN
    networks:
      labnet:
        ipv4_address: 172.30.0.10

  target:
    # Pinned, not :alpine. An unpinned public image can change under a lab between
    # one cohort and the next — a guide written against one version quietly stops
    # matching. Pin whatever you replace this with too.
    image: nginx:1.31.3-alpine  # multi-arch public example target — replace with your scenario
    container_name: __LAB_SLUG__-target
    hostname: target
    networks:
      labnet:
        ipv4_address: 172.30.0.20

networks:
  labnet:
    driver: bridge
    # `internal: true` removes the NAT gateway: containers still talk to each
    # other, but have no route to the internet OR to the network the host sits
    # on. Keep it. The attacker box here holds NET_ADMIN, and without this a
    # student can scan the real network they are sitting on — from a machine
    # that is not theirs, with traffic that appears to come from it.
    #
    # TWO CASES WHERE THIS BREAKS THINGS — both verified, neither documented:
    #  1. It SILENTLY DISCARDS published ports. If you add a `ports:` entry for a
    #     browser-based lab, the container comes up with no host mapping and no
    #     warning. Such a service must go on a separate, non-internal network and
    #     be bound to 127.0.0.1 instead (see README).
    #  2. It breaks routing BETWEEN two lab networks. If you add a second segment
    #     and route between them (a firewall or VPN lab), Docker's
    #     `! -s <subnet> -o <bridge> -j DROP` rule drops the crossing traffic —
    #     the lab starts cleanly and is quietly useless. Drop `internal` on those.
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
